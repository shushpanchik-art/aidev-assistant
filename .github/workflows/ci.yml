name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      WEB_AUTH_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy ai db config.py

      - name: Bandit (security)
        run: bandit -r ai db web config.py -x tests

      - name: Pytest
        run: pytest -q  
